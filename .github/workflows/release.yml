name: Build and release
run-name: Release (${{ inputs.visibility }}, ${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: Create a draft or publish the release?
        required: true
        type: choice
        default: draft
        options:
          - draft
          - public
      bump:
        description: Version increment (includes existing drafts)
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

# Serialize the whole workflow so two builds cannot allocate the same version.
concurrency:
  group: metafix-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Authenticated access to draft releases.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Test version calculation
        run: node --test tests/*.test.cjs
      - name: Allocate next version
        id: version
        uses: actions/github-script@v8
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        with:
          script: |
            const { prepare } = require('./scripts/release-version.cjs');
            await prepare({ github, context, core });

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_API: pyside6
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Confirm native Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libasound2
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Test build asset paths
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check application imports and bundled resource paths
        run: python scripts/check_app.py
      - name: Build native archive
        run: python scripts/build.py --version "$RELEASE_VERSION"
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Tag, upload all builds, and set release visibility
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        with:
          script: |
            const { publish } = require('./scripts/publish-release.cjs');
            await publish({ github, context, core });
