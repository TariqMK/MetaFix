name: Build and release
run-name: Release (${{ inputs.visibility }}, ${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: Create a draft or publish the release?
        required: true
        type: choice
        default: draft
        options:
          - draft
          - public
      bump:
        description: Version increment (includes existing drafts)
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

# Serialize the whole workflow so two builds cannot allocate the same version.
concurrency:
  group: metafix-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Authenticated access to draft releases.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Test version calculation
        run: node --test tests/release-version.test.cjs
      - name: Allocate next version
        id: version
        uses: actions/github-script@v7
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        with:
          script: |
            const { prepare } = require('./scripts/release-version.cjs');
            await prepare({ github, context, core });

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_API: pyside6
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Confirm native Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libasound2
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Check application imports and bundled resource paths
        run: python scripts/check_app.py
      - name: Build native archive
        run: python scripts/build.py --version "$RELEASE_VERSION"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Tag, upload all builds, and set release visibility
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VISIBILITY: ${{ inputs.visibility }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            const files = fs.readdirSync('release-assets');
            if (files.length !== 3) throw new Error('Expected all three platform archives');
            // Explicit tag pins both draft and public releases to the built commit.
            await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
            const { data: release } = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: context.sha,
              name: `MetaFix ${tag}`, draft: true, prerelease: false,
              generate_release_notes: true,
            });
            for (const name of files) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release-assets', name)),
              });
            }
            if (process.env.RELEASE_VISIBILITY === 'public') {
              await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false });
            }
            await core.summary.addHeading(`MetaFix ${tag}`)
              .addLink('View release', release.html_url).write();
